[tool.poetry]
name = "smm-chat-bot"
version = "0.4.0"
description = "Telegram bot with AI functions"
authors = ["ArtParse <artparse90@gmail.com>, BlackNikita <nikitaexp10x@gmail.com>, DimaReyzer <dimarazar@yandex.ru>, Nevecherya Artyom <artiom1989@mail.ru>, Ryttaren <norw.first@gmail.com>, Wiam <meganite647@gmail.com>"]
license = "Copyright (c) 2024 Astro Synth AI. All rights reserved."
readme = "README.md"
packages = [
    { include = "app" },
]

[tool.poetry.dependencies]
python = "^3.11"
python-dotenv = "^1.0.1"
python-telegram-bot = "^21.4"
aiosqlite = "^0.20.0"
aiohttp = "^3.9.5"
nltk = "^3.8.1"
piexif = "^1.1.3"
pillow = "^10.4.0"
aiofiles = "^24.1.0"
requests = "^2.32.3"
feedparser = "^6.0.11"
beautifulsoup4 = "^4.12.3"
telethon = "^1.36.0"
apscheduler = "^3.10.4"
sentence-transformers = "^3.0.1"
requests-cache = "^1.2.1"
numpy = "<2"
watchdog = "^4.0.1"
fastapi = "^0.111.1"
pandas = "^2.2.3"
matplotlib = "^3.9.2"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
start = "app.main_watchdog:main"